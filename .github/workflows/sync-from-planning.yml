name: Sync exact AB Planning front to TERACITY

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-from-planning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TERACITY
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current AB Planning
        run: git clone --depth 1 https://github.com/abrenov35/planning-ab.git /tmp/planning-ab

      - name: Replace TERACITY front with exact AB Planning files
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/sync-from-planning.yml' \
            /tmp/planning-ab/ ./

          # Keep only TERACITY-specific identity and backend.
          sed -i 's#https://script.google.com/macros/s/AKfycbxOE2bAsnGKn1TvOlxBK1qJpe2nblhC4l8YWmAxTUe3VM383YaNrPmH3i1U2g-Sp7LJxA/exec#https://script.google.com/macros/s/AKfycbzM-uwPH8Dgc3bajBXXkMz2mi7LwUL7KjLA5PeIhqFYJaPc-jEMFa2UxEFLErrdtpgv/exec#g' src/utils/api.js
          sed -i 's#https://abrenov35.github.io/planning-ab#https://abrenov35.github.io/teracity-gantt#g' package.json
          sed -i 's#"name": "planning-ab"#"name": "teracity-gantt"#g' package.json package-lock.json

          # Change only the visible application name; all behaviours stay identical.
          grep -rl --exclude-dir=.git --exclude='sync-from-planning.yml' 'AB PLANNING' src public 2>/dev/null | xargs -r sed -i 's/AB PLANNING/TERACITY GANTT/g'

      - name: Commit synchronized files
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
          else
            git commit -m 'Sync TERACITY with current AB Planning front'
            git push origin main
          fi
